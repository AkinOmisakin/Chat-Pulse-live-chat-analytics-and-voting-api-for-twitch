[project]
name = "chat-pulse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AkinOmisakin", email = "u04ao21@abdn.ac.uk" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
]

[project.scripts]
chat-pulse = "chat_pulse:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]
